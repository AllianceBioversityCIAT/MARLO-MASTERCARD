# MARLO-REAP STAGING: continuous integration only (copy of MARLO STAGING, CCAFS/MARLO marlo-staging-ci.yml).
#
#   push to staging -> GitHub Actions (image build, not published) -> Jenkins marlo-reap-staging-ci (verify + Jira + final Slack)
#
# CI only: no deploy, no SSH, no ECR push, no AWS access and no Secrets Manager read. REAP STAGING is new (owner
# decision, 2026-11-11: REAP follows MARLO, as MARLO-FSRP). The MARLO workflows that arrive with the CCAFS/MARLO
# merges (marlo-*.yml, jenkins-trigger-java-*.yml) are disabled in this repository's Actions settings.
#
# Build: the ORIGINAL Dockerfile (`mvn clean install -Dmaven.test.skip=true` inside it, as in MARLO STAGING; no tests
# are added). The MARLO properties are read only at application start-up (@PropertySource), so the build needs no
# secret: the image is built without them and discarded with the runner, never pushed.
# Jenkins finalization (jenkins-ci-finalize.reusable.yml, verbatim from MARLO STAGING): only when the build passed; it
# does not wait. GitHub Environment reap-staging (deployment branch staging only, no variables, no secrets) is the gate
# of that hand-over; it uses the repository secrets JENKINS_USERNAME / JENKINS_API_TOKEN.
# The job name `build image (reap, not published)` is part of the Jenkins contract (stage "Verify CI Run" of
# devops PIPES/AICCRA-REAP/staging/github-actions-ci/Jenkinsfile). Rename it only together with the Jenkinsfile.
#
# Slack (Reporting Tool format, one message per event, never duplicated):
#   started     GitHub Actions, at the start of the run (slack-notify.reusable.yml)
#   failed      GitHub Actions, when the build (or the Jenkins hand-over) failed or was cancelled; Jenkins is not called
#   succeeded   Jenkins marlo-reap-staging-ci, after verifying the run
#   SLACK_NOTIFICATIONS_WEBHOOK_URL (incoming webhook of #notifications-platform). Without it the notifications are
#   skipped with a warning; they never block the pipeline.
#
# Action pinning: every `uses:` is a full commit SHA (same SHA as the MARLO pipelines):
#   actions/checkout  v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
name: reap-staging-ci

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions: {}

concurrency:
  group: reap-staging-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- start notification
  notify-start:
    name: notify start (Slack)
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: started
      title: MARLO-REAP NEW ENVIRONMENT
      project: MARLO-REAP
      environment-label: STAGING
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}

  # ---------------------------------------------------------------- build (no secrets, no AWS, not published)
  # The legacy job runs no lint and no tests (none added, as in MARLO). The image build compiles the WAR.
  build-image:
    name: build image (reap, not published)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (original Dockerfile, local only)
        run: docker build --tag "local/reap:${{ github.run_id }}-${{ github.run_attempt }}" .

  # ---------------------------------------------------------------- Jenkins finalization
  # Only when the build passed: Jenkins verifies the run, sends the Jira build info and posts the final Slack
  # message. Does not wait.
  finalize:
    name: finalize (Jenkins marlo-reap-staging-ci)
    needs: build-image
    if: needs.build-image.result == 'success'
    permissions: {}
    uses: ./.github/workflows/jenkins-ci-finalize.reusable.yml
    with:
      jenkins-job: marlo-reap-staging-ci
      environment: reap-staging
    secrets:
      JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
      JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

  # ---------------------------------------------------------------- CI failure notification
  # Only when the run failed before Jenkins accepted the request. Jenkins is not called on failure.
  notify-ci-failure:
    name: notify CI failure (Slack)
    needs: [build-image, finalize]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: failed
      title: MARLO-REAP NEW ENVIRONMENT
      project: MARLO-REAP
      environment-label: STAGING
      detail: >-
        build-image=${{ needs.build-image.result }},
        jenkins-hand-over=${{ needs.finalize.result }}
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}
